<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GooHai · 发型图库</title><style>
:root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--text:#263449;--muted:#718096;--line:#d5dce6;--green:#dcebdd;--green-text:#2f4e36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Microsoft YaHei",sans-serif}.compact-header{height:52px;display:flex;align-items:center;gap:18px;padding:0 22px;background:#e9efea;border-bottom:1px solid var(--line)}.compact-header strong{font-size:16px}.compact-header span{font-size:12px;color:var(--muted)}.compact-gallery{max-width:1800px;margin:auto;padding:14px 20px 30px}.compact-controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0 12px}.ghil-category-row{display:flex;gap:8px;align-items:center}.hair-filters{display:flex;gap:7px;overflow-x:auto;min-width:0}.hair-chip,.favorite-filter{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);white-space:nowrap;cursor:pointer}.hair-chip[aria-pressed=true],.favorite-filter[aria-pressed=true]{background:#364e79;border-color:#364e79;color:#fff}.hair-chip small{margin-left:5px;color:var(--muted)}.hair-chip[aria-pressed=true] small{color:#dbe5f5}.favorite-filter{flex-shrink:0}.search-row{display:flex;gap:10px;margin-top:10px}.search-box{display:block;flex:1;min-width:0}#subcategory{max-width:35%;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);font:inherit}#subcategory[hidden]{display:none}.search-box input{width:100%;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);outline:none}.compact-result{color:var(--muted);font-size:12px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px 14px}.portrait-card{min-width:0}.card-image{position:relative;overflow:hidden;border-radius:7px;background:#eef0f2;aspect-ratio:399/500}.card-image img{display:block;width:100%;height:100%;object-fit:cover}.card-body{padding:7px 2px}.card-heading{display:flex;justify-content:space-between;gap:6px}.card-heading h3{margin:0;font-size:13px;line-height:1.35;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-meta{margin-top:4px;color:var(--muted);font-size:11px}.card-download{display:none}.card-type{position:absolute;left:8px;bottom:8px;padding:2px 6px;border-radius:4px;background:#ffffffe8;color:#526071;font-size:10px}.ghil-actions{position:absolute;inset:8px 8px auto;display:flex;justify-content:space-between;gap:8px;z-index:3;opacity:0;transition:opacity .15s;pointer-events:none}.card-image:hover>.ghil-actions,.card-image:focus-within>.ghil-actions,.portrait-card:hover .ghil-actions,.portrait-card:focus-within .ghil-actions{opacity:1}.ghil-actions button{pointer-events:auto;display:grid;place-items:center;min-width:38px;height:36px;padding:0 12px;border:1px solid #d4dce5;border-radius:7px;background:#fffffff0;color:#23334c;cursor:pointer;font:14px "Microsoft YaHei",sans-serif;box-shadow:0 2px 8px #0002}.ghil-actions .card-favorite{font:28px Arial,sans-serif;padding:0;width:38px;color:#23334c}.ghil-actions .card-favorite[aria-pressed=true]{color:#e2264d}.ghil-actions button[data-use]{background:var(--green);color:var(--green-text);border-color:#afc9b3}.ghil-heart-icon{display:block;width:22px;height:22px;fill:none;stroke:#263449;stroke-width:1.55;stroke-linejoin:round}.card-favorite[aria-pressed=true] .ghil-heart-icon{fill:#e2264d;stroke:#e2264d}.viewer-side #viewer-favorite[aria-pressed=true] .ghil-heart-icon{fill:#e2264d;stroke:#e2264d}.viewer-side #viewer-favorite{display:flex;align-items:center;justify-content:center;gap:7px}.empty{text-align:center;padding:60px;color:var(--muted)}.end-note{text-align:center;color:var(--muted);font-size:12px}.viewer{width:min(1100px,calc(100% - 32px));border:0;border-radius:10px;padding:0;background:var(--panel);color:var(--text)}.viewer::backdrop{background:#10172299}.viewer-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;min-height:580px}.viewer-stage{position:relative;display:grid;place-items:center;background:#eef0f2}.viewer-stage img{max-width:100%;max-height:80vh;object-fit:contain}.viewer-side{padding:34px 24px}.viewer-side h2{margin:8px 0}.viewer-side button{width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}#use-portrait{background:var(--green);color:var(--green-text);border-color:#afc9b3}.viewer-close{position:absolute;right:12px;top:12px;width:30px;height:30px;border:0;border-radius:50%;background:#fff}.viewer-nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:#20252b66;color:#fff;width:34px;height:48px;font-size:26px}.viewer-nav.prev{left:10px}.viewer-nav.next{right:10px}@media(max-width:700px){.compact-gallery{padding-inline:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 9px}.viewer-layout{grid-template-columns:1fr}.viewer-side{padding:18px}.viewer-stage{min-height:50vh}}

.ghil-random-controls{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.ghil-random-toggle{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;font:14px "Microsoft YaHei",sans-serif}
.ghil-random-toggle input{appearance:none;position:relative;width:32px;min-width:32px;height:18px;margin:0;padding:0;border:0;border-radius:20px;background:#b9c3d1;cursor:pointer;outline-offset:3px}
.ghil-random-toggle input::before{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:white;box-shadow:0 1px 3px #0002}
.ghil-random-toggle input:checked{background:#364e79}
.ghil-random-toggle input:checked::before{left:16px}
.ghil-random-toggle input:focus-visible{outline:2px solid #517fc4}
.ghil-random-controls .ghil-shuffle{display:grid;place-items:center;width:36px;height:36px;padding:4px;border:1px solid #d5dce6;border-radius:7px;background:white;cursor:pointer}
.ghil-random-controls .ghil-shuffle:hover{background:#e9eff8;border-color:#364e79}
.grid.landscape{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.landscape .card-image{aspect-ratio:3/2}
.grid.landscape .card-image img{object-fit:contain}
@media(max-width:700px){.grid.landscape{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ghil-random-controls .ghil-random-settings{display:grid;place-items:center;width:30px;height:30px;padding:3px;border:0;background:transparent;color:#647188;cursor:pointer}
.ghil-random-controls .ghil-random-settings:hover{color:#364e79;background:#e9eff8;border-radius:6px}
.ghil-random-dialog{width:min(360px,calc(100% - 32px));border:0;border-radius:12px;padding:0;color:#23334c;box-shadow:0 18px 60px #17244244}
.ghil-random-dialog::backdrop{background:#13253a88}
.ghil-random-dialog form{padding:20px}
.ghil-random-dialog h3{margin:0 0 14px;font-size:16px}
.ghil-random-options{display:grid;gap:8px;max-height:50vh;overflow:auto}
.ghil-random-option{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;background:#f5f7fb;cursor:pointer}
.ghil-random-option input{width:auto;min-width:auto}
.ghil-random-dialog menu{display:flex;justify-content:flex-end;gap:8px;margin:18px 0 0;padding:0}
.ghil-random-dialog button{padding:8px 14px;border:1px solid #d5dce6;border-radius:7px;background:white;color:#23334c;cursor:pointer}
</style></head><body>
<main id="gallery" class="compact-gallery"><section class="compact-controls"><div class="ghil-category-row"><div id="hair-filters" class="hair-filters" role="group" aria-label="发型长度"></div><button id="favorite-filter" class="favorite-filter" type="button" aria-pressed="false">♡ 收藏 <span id="favorite-count">0</span></button><div class="ghil-random-controls"><button id="random-settings" class="ghil-random-settings" type="button" title="选择随机包含的分类" aria-label="选择随机包含的分类"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m9 3-.5 2.4-1.4.8-2.3-.7-3 5.1 1.8 1.6v1.6l-1.8 1.6 3 5.1 2.3-.7 1.4.8.5 2.4h6l.5-2.4 1.4-.8 2.3.7 3-5.1-1.8-1.6v-1.6l1.8-1.6-3-5.1-2.3.7-1.4-.8L15 3Z" transform="translate(0 -1) scale(1 .95)"/><circle cx="12" cy="12" r="3"/></svg></button><label class="ghil-random-toggle">随机<input id="random-toggle" type="checkbox" role="switch"></label><button id="shuffle" class="ghil-shuffle" type="button" title="随机排序当前分类" aria-label="随机排序当前分类"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 30 10 16 18 2 10Z" fill="#f6be48"/><path d="M2 10 16 18 16 30 2 22Z" fill="#9b6fe8"/><path d="M16 18 30 10 30 22 16 30Z" fill="#36b9c5"/><ellipse cx="16" cy="10" rx="3" ry="1.8" fill="white"/><ellipse cx="7" cy="16" rx="1.7" ry="2.2" fill="white"/><ellipse cx="11" cy="24" rx="1.7" ry="2.2" fill="white"/><ellipse cx="25" cy="17" rx="1.7" ry="2.2" fill="white"/><ellipse cx="21" cy="25" rx="1.7" ry="2.2" fill="white"/></svg></button></div></div><div class="search-row"><select id="subcategory" aria-label="小分类" hidden><option value="">全部</option></select><label class="search-box"><input id="search" type="search" placeholder="搜索发型或 ID" aria-label="搜索发型或 ID"></label></div></section><div class="compact-result"><p id="result-count"></p></div><div id="grid" class="grid" role="list"></div><div id="empty" class="empty" hidden>没有找到匹配的发型</div><div id="sentinel" style="height:1px" aria-hidden="true" hidden></div><p id="end-note" class="end-note" hidden>已显示全部发型</p></main>
<dialog id="viewer" class="viewer"><div class="viewer-layout"><div class="viewer-stage"><img id="viewer-image" alt=""><button id="viewer-prev" class="viewer-nav prev" type="button">‹</button><button id="viewer-next" class="viewer-nav next" type="button">›</button></div><aside class="viewer-side"><h2 id="viewer-title"></h2><p id="viewer-id"></p><button id="use-portrait" type="button">使用</button><button id="viewer-favorite" type="button">♡ 收藏</button></aside></div><button id="viewer-close" class="viewer-close" type="button">×</button></dialog><div id="toast" hidden></div>
<script src="data.js"></script><script type="module" src="ui/app.mjs"></script><dialog id="random-dialog" class="ghil-random-dialog"><form method="dialog"><h3>选择随机包含的分类</h3><div id="random-options" class="ghil-random-options"></div><menu><button value="cancel" type="submit">取消</button><button id="random-apply" value="default" type="submit">确定</button></menu></form></dialog>
</body></html>
